<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 - Page Not Found</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Potta+One&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            font-family: 'Potta One', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #content {
            text-align: center;
            padding: 0 4vw;
        }

        h1 {
            font-size: 15vw;
            line-height: 1;
            margin-bottom: 2rem;
        }

        p {
            font-size: 4vw;
            opacity: 0.8;
            margin-bottom: 3rem;
        }

        a {
            color: white;
            text-decoration: none;
            border: 2px solid white;
            padding: 1rem 2rem;
            font-size: 2vw;
            transition: all 0.3s ease;
        }

        a:hover {
            background: white;
            color: black;
        }

        @media (orientation: landscape) {
            h1 { font-size: 10vw; }
            p { font-size: 3vw; }
            a { font-size: 1.5vw; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="content">
            <h1>404</h1>
            <p>ページが見つかりませんでした</p>
            <a href="index.html">時計に戻る</a>
        </div>
    </div>
</body>

</html>
